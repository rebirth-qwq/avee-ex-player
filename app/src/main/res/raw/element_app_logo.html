<html><head><link rel="stylesheet" href="style.css"><style></style></head><body>
<div class="col">
<h2>应用标识</h2>

<!---->
    <p>
<pre>在左下角显示应用标识

标识会在曲目开始和结束时显示。购买高级版后可隐藏</pre>
    </p>
<h4>属性</h4>
<hr>
<!---->
<dl>
<dt id="visible">显示</dt>
<dd>
<p>如果未设置，标识将被隐藏</p>
</dd>
<dt id="color">颜色</dt>
<dd>
<p>标识的色调</p>
</dd>

<hr>

<dt id="typeFace">字体</dt>
<dd>
<p>指定使用的字体</p>
</dd>
</dl>
<!---->
</div>


<style media="screen" type="text/css">

.container {
width:100%;
}
.container div {
width:100%;
}
.container .header {
padding: 2px;
cursor: pointer;
}
.container .content {
display: none;
}

</style>


</body>
</html>
