<h2>组合</h2>

<!---->
    <p>
<pre>组合将元素组合成单个图像

组合（除总合成）不直接可见，而是用作效果的输入。有一种特殊类型的组成称为“总合成”，它是可见的，并将最终图像呈现到屏幕</pre>
    </p>
<h4>属性</h4>
<hr>
<!---->
<dl>
<dt id="introBlendMode">片头混合模式</dt>
<dd>
<p>片头/片尾屏幕的混合模式</p>
</dd>
<dt id="introFadeDuration">片头淡入时长</dt>
<dd>
<p>歌曲开头屏幕淡入时长</p>
</dd>
<dt id="outroFadeDuration">片尾淡入时长</dt>
<dd>
<p>歌曲结尾屏幕淡入时长</p>
</dd>
<dt id="introFadeColor">片头淡入颜色</dt>
<dd>
<p>片头/片尾屏幕淡入颜色</p>
</dd>
</dl>
