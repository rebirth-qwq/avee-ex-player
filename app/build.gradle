plugins {
    id 'com.android.application'
}

def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

def ksStoreFile = ksProps.getProperty('storeFile') ?: System.getenv('KS_STORE_FILE')
def ksStorePass = ksProps.getProperty('storePassword') ?: System.getenv('KS_STORE_PASSWORD')
def ksKeyAlias = ksProps.getProperty('keyAlias') ?: System.getenv('KS_KEY_ALIAS')
def ksKeyPass = ksProps.getProperty('keyPassword') ?: System.getenv('KS_KEY_PASSWORD')

if (!ksStoreFile) {
    def debugKs = new File(System.getProperty('user.home'), '.android/debug.keystore')
    if (debugKs.exists()) {
        ksStoreFile = debugKs.absolutePath
        ksStorePass = ksStorePass ?: 'android'
        ksKeyAlias = ksKeyAlias ?: 'androiddebugkey'
        ksKeyPass = ksKeyPass ?: 'android'
    }
}

android {
    namespace 're.ex.avee'

    compileSdk 34

    defaultConfig {
        applicationId "re.ex.avee"
        minSdk 23
        targetSdk 27
        versionCode 67
        versionName "0.1.0"

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        resourceConfigurations += ["en"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (ksStoreFile) {
            release {
                storeFile file(ksStoreFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            // minify 保持关闭：保留类名/方法名，便于与原版 smali 持续对拍。
            minifyEnabled false
            shrinkResources false
            debuggable false
            // 构建即签名：assembleRelease 直接产出可安装的已签名 APK
            if (ksStoreFile) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    // 资源来源沿用 apktool 解包结果，路径即标准 Android 工程布局。
    // app 内的库资源副本（abc_*/design_*/mtrl_* 等）优先覆盖 AAR 同名资源，
    // 保持与原 APK 一致的视觉与行为。
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    aaptOptions {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 反编译还原工程：一次暴露尽可能多的编译错误，便于批量修复
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/*.kotlin_module',
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }
}

dependencies {
    // ════════════════════════════════════════════════════════════════
    // 阶段2：全部第三方库走 Gradle 在线依赖，项目内零本地 jar。
    // 版本对齐原 APK dex：androidx appcompat 1.2.0 / material 1.3.0 /
    // recyclerview 1.1.0 / ExoPlayer 2.8.2 / Glide 3.7.0 / kotlin 1.4.0。
    // 广告(GMS Ads)、计费(BillingClient)、Firebase 已随功能删除，不再引入。
    // ════════════════════════════════════════════════════════════════

    // ── AndroidX（viewpager/drawerlayout/vectordrawable/core/fragment 由传递依赖提供） ──
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.browser:browser:1.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // ── Material Components（NavigationView / BadgeDrawable） ──
    implementation 'com.google.android.material:material:1.3.0'

    // ── ExoPlayer 2.8.2（与原 dex 完全同版本，API 面无需适配）
    //    该版本 pom 依赖旧 com.android.support，与 androidx 类重复，需排除。 ──
    implementation('com.google.android.exoplayer:exoplayer-core:2.8.2') {
        exclude group: 'com.android.support'
    }
    implementation('com.google.android.exoplayer:exoplayer-dash:2.8.2') {
        exclude group: 'com.android.support'
    }
    implementation('com.google.android.exoplayer:exoplayer-hls:2.8.2') {
        exclude group: 'com.android.support'
    }
    implementation('com.google.android.exoplayer:exoplayer-smoothstreaming:2.8.2') {
        exclude group: 'com.android.support'
    }
    implementation('com.google.android.exoplayer:exoplayer-ui:2.8.2') {
        exclude group: 'com.android.support'
    }

    // ── 图片加载（Glide 3.x API，不可升级到 4.x） ──
    implementation 'com.github.bumptech.glide:glide:3.7.0'

    // ── 原 vendor 源码迁入的在线依赖（阶段2清理）──
    implementation 'com.andreabaccega:com.triggertrap.seekarc:1.0.1'
    implementation 'io.github.ShawnLin013:number-picker:2.4.13'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'

    // ── MP3 标签 ──
    implementation 'com.mpatric:mp3agic:0.9.1'

    // ── Kotlin 运行时（源码使用 kotlin.UByte / ShortCompanionObject） ──
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.4.0'

    // ── 测试断言（app 代码中使用 junit.framework.Assert） ──
    implementation 'junit:junit:4.12'
}
